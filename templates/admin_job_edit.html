{% extends "base.html" %}

{% block title %}Edit Job | CareerLink{% endblock %}

{% block content %}
<section class="section-pad">
    <div class="container">
        <div class="section-header mb-4">
            <span class="eyebrow-badge">Admin Jobs</span>
            <h1 class="mt-3">Edit Job Listing</h1>
            <p class="text-muted mb-0">Update the selected job details and keep the listing accurate for users.</p>
        </div>

        <div class="glass-panel p-4">
            <form method="POST" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="title">Job Title</label>
                    <input class="form-control" id="title" name="title" value="{{ job.title }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="company">Company Name</label>
                    <input class="form-control" id="company" name="company" value="{{ job.company }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="location">Location</label>
                    <input class="form-control" id="location" name="location" value="{{ job.location }}" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="skills">Skills</label>
                    <input class="form-control" id="skills" name="skills" value="{{ job.skills }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="platform">Platform</label>
                    <input class="form-control" id="platform" name="platform" value="{{ job.platform }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="link">Job Link</label>
                    <input class="form-control" id="link" name="link" value="{{ job.link }}" required>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('admin_jobs') }}" class="btn btn-outline-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
